name: Bug report
description: Report a defect in mcp-shodan
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys or IPs and hostnames from private investigations. Use public, well-known targets in reproductions (for example 8.8.8.8 or CVE-2021-44228).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error text.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Tool call
      description: 'The tool and arguments you used, for example shodan_search with {"query": "product:nginx", "max_results": 5}.'
      render: json

  - type: input
    id: version
    attributes:
      label: mcp-shodan version
      description: Output of `npm ls -g @burtthecoder/mcp-shodan`, or the commit you built from.
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version and OS
      description: For example, Node 22.11 on macOS 15 arm64.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client and version
      description: For example, Claude Desktop, Claude Code, VS Code, or "unknown".
    validations:
      required: true

  - type: dropdown
    id: plan
    attributes:
      label: Shodan plan
      options: [Free (no membership), Membership, Paid API plan, Not sure]

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included API keys or indicators from private investigations.
          required: true
